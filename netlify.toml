[build]
  command = "npm run build"
  publish = ".next"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/study/*"
  to = "/"
  status = 200

[[redirects]]
  from = "/practice/*"
  to = "/"
  status = 200

[[redirects]]
  from = "/progress/*"
  to = "/"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/"
  status = 200
